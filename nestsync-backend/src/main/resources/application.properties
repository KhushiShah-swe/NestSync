spring.application.name=nestsync
spring.profiles.default=dev
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
nestsync.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
nestsync.jwt.secret=${JWT_SECRET:}
nestsync.jwt.ttl-ms=3600000
nestsync.jwt.allow-ephemeral=false
springdoc.swagger-ui.path=/swagger-ui.html
