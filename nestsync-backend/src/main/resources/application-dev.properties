# Local persistent data; this folder is ignored by Git.
spring.datasource.url=jdbc:h2:file:./data/nestsync;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# A random signing key is generated at each boot unless JWT_SECRET is provided.
nestsync.jwt.allow-ephemeral=true
