name: Bug report
description: Report reproducible behavior that needs a fix.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe actual and expected behavior. Do not include passwords or tokens.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Java/Node versions, H2 or MySQL, commit SHA
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: A regression test that fails before the fix and passes after it.
