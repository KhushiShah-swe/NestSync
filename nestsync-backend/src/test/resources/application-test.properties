spring.datasource.url=${TEST_DATABASE_URL:jdbc:h2:mem:nestsync-test;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DATABASE_USERNAME:sa}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
nestsync.jwt.secret=test-only-signing-key-with-at-least-32-bytes
nestsync.jwt.allow-ephemeral=false
